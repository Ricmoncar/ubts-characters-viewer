<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --black: #121212;
            --white: #f8f8f8;
            --gold: #d4af37;
            --dark-gold: #b8860b;
            --light-gold: #f5df9e;
            --fire: #ff4500;
            --water: #1e90ff;
            --earth: #8b4513;
            --air: #87ceeb;
            --light: #fffacd;
            --dark: #483d8b;
            --plant: #2e8b57;
            
            /* Character-specific color schemes */
            --blackjack-primary: #1e90ff; /* Blue for HUMILITY */
            --blackjack-secondary: #ff8c00; /* Orange for BRAVERY */
            
            --yuki-primary: #add8e6; /* Light blue */
            --yuki-secondary: #f0f8ff; /* Ice blue */
            
            --flowey-primary: #8b0000; /* Dark red */
            --flowey-secondary: #2e8b57; /* Green for plants/vines */
            
            --snaps-primary: #32cd32; /* Bright green */
            --snaps-secondary: #006400; /* Dark green */
            
            /* Neon colors for Snaps */
            --snaps-neon: #39ff14; /* Bright neon green */
            --snaps-neon-glow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 30px #39ff14;
        }

        * {
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            position: relative; /* For snow overlay positioning */
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
            position: relative;
            animation: fadeInDown 1.5s ease;
        }

        h1 {
            font-weight: 300;
            font-size: 2.5rem;
            color: var(--gold);
            letter-spacing: 1px;
            margin: 0.5rem 0;
            animation: glow 3s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px var(--gold), 0 0 10px var(--gold);
            }
            to {
                text-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold), 0 0 30px var(--gold);
            }
        }

        @keyframes fadeInDown {
            from { 
                opacity: 0; 
                transform: translateY(-30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .characters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            animation: fadeIn 1.5s ease;
        }

        .character-btn {
            background-color: transparent;
            border: 2px solid var(--gold);
            color: var(--white);
            padding: 0.8rem 1.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.6s;
            outline: none;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        .character-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: all 0.8s;
        }

        .character-btn:hover::before {
            left: 100%;
        }

        .character-btn:hover {
            background-color: var(--gold);
            color: var(--black);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .character-btn.active {
            background-color: var(--gold);
            color: var(--black);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .status-message {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            font-size: 0.9rem;
            color: var(--light-gold);
            margin-bottom: 1rem;
        }

        .real-time-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .music-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            gap: 15px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
            flex-wrap: wrap;
        }

        .music-controls:hover {
            opacity: 1;
        }

        .music-toggle {
            background-color: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(212, 175, 55, 0.2);
        }

        .music-toggle:hover {
            background-color: var(--gold);
            color: var(--black);
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .music-toggle.muted {
            opacity: 0.5;
            box-shadow: none;
        }

        #music-status {
            color: var(--light-gold);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        /* GitHub troubleshooting message */
        .troubleshoot-message {
            display: none;
            padding: 10px 15px;
            background-color: rgba(255, 69, 0, 0.1);
            border: 1px solid rgba(255, 69, 0, 0.5);
            border-radius: 5px;
            color: var(--light-gold);
            margin-top: 10px;
            font-size: 0.85rem;
            animation: fadeIn 0.5s ease;
        }
        
        .troubleshoot-message.show {
            display: block;
        }

        /* Volume Slider Styling */
        .volume-control {
            display: flex;
            align-items: center;
            margin-left: 15px;
            background-color: rgba(212, 175, 55, 0.1);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
        }

        .volume-control:hover {
            background-color: rgba(212, 175, 55, 0.2);
            border-color: rgba(212, 175, 55, 0.5);
        }

        .volume-control i {
            color: var(--gold);
            margin-right: 8px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            border-radius: 5px;
            background: linear-gradient(to right, var(--gold) 0%, var(--gold) 100%);
            outline: none;
            transition: all 0.3s;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .volume-slider::-moz-range-thumb {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--gold);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            border: none;
        }

        .volume-slider::-webkit-slider-thumb:hover,
        .volume-slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .volume-level {
            font-size: 0.8rem;
            color: var(--light-gold);
            margin-left: 8px;
            min-width: 28px;
        }

        .character-display {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            position: relative; /* For snow/petals positioning */
        }

        /* Character profiles and sections */
        .character-profile {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold);
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.7s ease, box-shadow 0.7s ease;
        }

        .character-profile:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3);
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
            margin-bottom: 1rem;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        .character-info, .character-stats, .character-inventory, .character-magic {
            flex: 1;
            min-width: 300px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--gold);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateZ(0);
            transition: transform 0.7s ease, box-shadow 0.7s ease;
        }

        h2 {
            margin-top: 0;
            color: var(--gold);
            font-weight: 400;
            border-bottom: 1px solid var(--light-gold);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        h2 i {
            margin-right: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            transition: all 0.5s ease;
        }

        .stat:hover {
            background-color: rgba(255, 255, 255, 0.05);
            padding-left: 0.5rem;
            border-radius: 5px;
        }

        .stat-name {
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .stat-name i {
            margin-right: 8px;
            color: var(--light-gold);
            transition: transform 0.5s ease;
        }

        .stat:hover .stat-name i {
            transform: scale(1.2) rotate(15deg);
        }

        .stat-value {
            color: var(--gold);
            font-weight: 300;
            transition: all 0.5s ease;
        }

        .stat:hover .stat-value {
            letter-spacing: 1px;
        }

        .mana-container {
            width: 100%;
            height: 20px;
            background-color: rgba(30, 144, 255, 0.2);
            border-radius: 10px;
            margin-top: 0.5rem;
            overflow: hidden;
            position: relative;
        }

        .mana-bar {
            height: 100%;
            background: linear-gradient(90deg, #1e90ff, #00bfff);
            border-radius: 10px;
            width: 0%;
            transition: width 1.5s ease-in-out;
            animation: shimmer 4s infinite;
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.7s;
        }

        .inventory-item:hover {
            background-color: rgba(212, 175, 55, 0.1);
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .spell-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 1rem;
            border-left: 3px solid var(--gold);
            transition: all 0.7s;
            animation: fadeInRight 1.5s ease;
        }

        @keyframes fadeInRight {
            from { 
                opacity: 0; 
                transform: translateX(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateX(0); 
            }
        }

        .spell-card:hover {
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border-left-width: 5px;
        }

        .spell-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .spell-name {
            font-weight: 500;
            color: var(--white);
            display: flex;
            align-items: center;
        }

        .spell-cost {
            color: #1e90ff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }

        .spell-element {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            text-align: center;
            transition: all 0.6s ease;
        }

        .element-fire {
            background-color: rgba(255, 69, 0, 0.2);
            color: var(--fire);
            border: 1px solid var(--fire);
        }

        .element-water {
            background-color: rgba(30, 144, 255, 0.2);
            color: var(--water);
            border: 1px solid var(--water);
        }

        .element-earth {
            background-color: rgba(139, 69, 19, 0.2);
            color: var(--earth);
            border: 1px solid var(--earth);
        }

        .element-air {
            background-color: rgba(135, 206, 235, 0.2);
            color: var(--air);
            border: 1px solid var(--air);
        }

        .element-light {
            background-color: rgba(255, 250, 205, 0.2);
            color: var(--light);
            border: 1px solid var(--light);
        }

        .element-dark {
            background-color: rgba(72, 61, 139, 0.2);
            color: var(--dark);
            border: 1px solid var(--dark);
        }

        .element-plant {
            background-color: rgba(46, 139, 87, 0.2);
            color: var(--plant);
            border: 1px solid var(--plant);
        }

        .spell-description {
            font-size: 0.9rem;
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
            transition: all 0.5s ease;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: var(--gold);
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: var(--gold);
            animation: spin 1.5s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            height: 100vh;
            width: 100%;
        }

        .loading p {
            margin-top: 20px;
            color: var(--gold);
            font-size: 1.2rem;
        }

        .login-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.8rem 1.5rem;
            background-color: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.7s;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            animation: bounce 5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-link:hover {
            background-color: var(--gold);
            color: var(--black);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--gold);
            font-size: 0.9rem;
            color: var(--light-gold);
            animation: fadeIn 2s ease;
        }

        /* Character-specific styles */
        /* Blackjack (with state cycling) */
        .character-blackjack {
            transition: all 5s ease !important;
        }

        .character-blackjack .profile-image,
        .character-blackjack h2.character-name,
        .character-blackjack .character-stats,
        .character-blackjack .character-inventory,
        .character-blackjack .character-magic,
        .character-blackjack .mana-bar {
            transition: all 5s ease !important;
        }

        /* Humility state (Blue theme) */
        .character-blackjack.humility-state {
            border-color: var(--blackjack-primary);
            background: linear-gradient(135deg, rgba(30, 144, 255, 0.2), rgba(30, 144, 255, 0.05));
        }

        .character-blackjack.humility-state .profile-image {
            border-color: var(--blackjack-primary);
            box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
        }

        .character-blackjack.humility-state h2.character-name {
            color: var(--blackjack-primary);
            border-bottom-color: var(--blackjack-primary);
        }

        .character-blackjack.humility-state .character-stats,
        .character-blackjack.humility-state .character-inventory,
        .character-blackjack.humility-state .character-magic {
            border-color: var(--blackjack-primary);
        }

        .character-blackjack.humility-state .mana-bar {
            background: linear-gradient(90deg, var(--blackjack-primary), var(--blackjack-primary));
        }

        /* Bravery state (Orange theme) */
        .character-blackjack.bravery-state {
            border-color: var(--blackjack-secondary);
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.2), rgba(255, 140, 0, 0.05));
        }

        .character-blackjack.bravery-state .profile-image {
            border-color: var(--blackjack-secondary);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
        }

        .character-blackjack.bravery-state h2.character-name {
            color: var(--blackjack-secondary);
            border-bottom-color: var(--blackjack-secondary);
        }

        .character-blackjack.bravery-state .character-stats,
        .character-blackjack.bravery-state .character-inventory,
        .character-blackjack.bravery-state .character-magic {
            border-color: var(--blackjack-secondary);
        }

        .character-blackjack.bravery-state .mana-bar {
            background: linear-gradient(90deg, var(--blackjack-secondary), var(--blackjack-secondary));
        }

        /* Yuki (Light Blue) */
        .character-yuki {
            border-color: var(--yuki-primary);
            background: linear-gradient(135deg, rgba(173, 216, 230, 0.1), rgba(240, 248, 255, 0.1));
        }

        .character-yuki .profile-image {
            border-color: var(--yuki-primary);
            box-shadow: 0 5px 15px rgba(173, 216, 230, 0.4);
        }

        .character-yuki h2.character-name {
            color: var(--yuki-primary);
            border-bottom-color: var(--yuki-secondary);
        }

        .character-yuki .character-stats,
        .character-yuki .character-inventory,
        .character-yuki .character-magic {
            border-color: var(--yuki-primary);
        }

        .character-yuki .mana-bar {
            background: linear-gradient(90deg, var(--yuki-primary), var(--yuki-secondary));
        }

        /* Flowey (Red/Green) */
        .character-flowey {
            border-color: var(--flowey-primary);
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.1), rgba(46, 139, 87, 0.1));
        }

        .character-flowey .profile-image {
            border-color: var(--flowey-primary);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4);
        }

        .character-flowey h2.character-name {
            color: var(--flowey-primary);
            border-bottom-color: var(--flowey-secondary);
        }

        .character-flowey .character-stats,
        .character-flowey .character-inventory,
        .character-flowey .character-magic {
            border-color: var(--flowey-primary);
        }

        .character-flowey .mana-bar {
            background: linear-gradient(90deg, var(--flowey-primary), var(--flowey-secondary));
        }

        /* Snaps (Green) with Neon effect */
        .character-snaps {
            border-color: var(--snaps-primary);
            background: linear-gradient(135deg, rgba(50, 205, 50, 0.1), rgba(0, 100, 0, 0.1));
            position: relative;
        }

        .character-snaps .profile-image {
            border-color: var(--snaps-primary);
            box-shadow: 0 5px 15px rgba(50, 205, 50, 0.4);
        }

        .character-snaps h2.character-name {
            color: var(--snaps-primary);
            border-bottom-color: var(--snaps-secondary);
        }

        .character-snaps .character-stats,
        .character-snaps .character-inventory,
        .character-snaps .character-magic {
            border-color: var(--snaps-primary);
            position: relative; /* For neon borders */
        }

        .character-snaps .mana-bar {
            background: linear-gradient(90deg, var(--snaps-primary), var(--snaps-secondary));
        }
        
        /* Neon effect for Snaps */
        .neon-border {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 3px solid var(--snaps-neon);
            border-radius: 12px;
            pointer-events: none;
            box-shadow: var(--snaps-neon-glow);
            animation: neonPulse 4s infinite;
            z-index: 2;
        }
        
        @keyframes neonPulse {
            0% { opacity: 0.4; box-shadow: 0 0 5px var(--snaps-neon), 0 0 10px var(--snaps-neon); }
            50% { opacity: 1; box-shadow: 0 0 10px var(--snaps-neon), 0 0 20px var(--snaps-neon), 0 0 30px var(--snaps-neon); }
            100% { opacity: 0.4; box-shadow: 0 0 5px var(--snaps-neon), 0 0 10px var(--snaps-neon); }
        }
        
        /* Enhanced Neon effect for Snaps */
        .character-snaps {
            position: relative;
            overflow: visible;
        }
        
        .character-snaps .character-stats,
        .character-snaps .character-inventory,
        .character-snaps .character-magic,
        .character-snaps.character-profile {
            position: relative;
            overflow: visible;
            z-index: 1;
        }

        /* Animation for state indicator */
        .music-state-indicator {
            display: inline-block;
            font-size: 0.85rem;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            margin-left: 10px;
            transition: all 5s ease;
        }

        .music-state-indicator.humility {
            background-color: rgba(30, 144, 255, 0.2);
            color: #1e90ff;
            border: 1px solid #1e90ff;
        }

        .music-state-indicator.bravery {
            background-color: rgba(255, 140, 0, 0.2);
            color: #ff8c00;
            border: 1px solid #ff8c00;
        }

            height: 8px;

        /* Snowfall animation */
        @keyframes snowfall {
            0% {

                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {

            }

        .snowflake::before {

            top: 0;
            left: 0;
            right: 0;

        /* Petal fall animation */

            }
            10% {

            // Update all audio elements volume
            setAllAudioVolume(currentVolume);
            
            // Update background gradient on the slider to show volume level
            const percentage = (volumePercent - volumeSlider.min) / (volumeSlider.max - volumeSlider.min) * 100;
            volumeSlider.style.background = `linear-gradient(to right, var(--gold) 0%, var(--gold) ${percentage}%, rgba(255, 255, 255, 0.2) ${percentage}%, rgba(255, 255, 255, 0.2) 100%)`;
            
            // Save volume setting to localStorage
            localStorage.setItem('characterViewerVolume', currentVolume);

                volumeSlider.style.background = `linear-gradient(to right, var(--gold) 0%, var(--gold) ${percentage}%, rgba(255, 255, 255, 0.2) ${percentage}%, rgba(255, 255, 255, 0.2) 100%)`;

                        });
                }
            } catch (error) {
                console.error("Error in checkAudioLoading:", error);
            }
        }
        
                // Audio crossfade function
                function crossfadeAudio(fadeOutAudio, fadeInAudio, duration = CROSSFADE_DURATION) {
                    try {
                        // Validate inputs
                        if (!fadeOutAudio || !fadeInAudio) {
                            console.warn("Invalid audio elements for crossfade");
                            return;
                        }
                        
                        // Clear any existing crossfade
                        if (crossfadeTimeoutId) {
                            clearInterval(crossfadeTimeoutId);
                        }
                        
                        // Start positions must match
                        fadeInAudio.currentTime = fadeOutAudio.currentTime;
                        
                        // Set both to current volume
                        const startVolume = currentVolume;
                        fadeOutAudio.volume = startVolume;
                        
                        // Start the new audio at 0 volume
                        fadeInAudio.volume = 0;
                        
                        // Handle autoplay restrictions
                        const playPromise = fadeInAudio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(e => {
                                console.log("Audio crossfade failed:", e);
                                return;
                            });
                        }
                        
                        // Number of steps for the crossfade
                        const steps = 20;
                        const stepTime = duration / steps;
                        const volumeStep = startVolume / steps;
                        
                        let currentStep = 0;
                        
                        // Create interval for the crossfade
                        crossfadeTimeoutId = setInterval(() => {
                            currentStep++;
                            
                            // Calculate new volumes
                            const outVol = Math.max(0, startVolume - (volumeStep * currentStep));
                            const inVol = Math.min(startVolume, volumeStep * currentStep);
                            
                            // Set new volumes
                            fadeOutAudio.volume = outVol;
                            fadeInAudio.volume = inVol;
                            
                            // Finish crossfade
                            if (currentStep >= steps) {
                                fadeOutAudio.pause();
                                fadeOutAudio.volume = startVolume; // Reset volume for next time
                                clearInterval(crossfadeTimeoutId);
                                crossfadeTimeoutId = null;
                            }
                        }, stepTime);
                    } catch (error) {
                        console.error("Error in crossfadeAudio:", error);
                    }
                }
        
        // Toggle music button
        const toggleMusicBtn = document.getElementById('toggle-music');
        const musicStatus = document.getElementById('music-status');
        
        toggleMusicBtn.addEventListener('click', function() {
            isMusicMuted = !isMusicMuted;
            
            if (isMusicMuted) {
                // If music is playing, save the current position before pausing
                saveCurrentAudioTime();
                pauseAllMusic();
                toggleMusicBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                musicStatus.textContent = 'Music: Off';
                toggleMusicBtn.classList.add('muted');
            } else {
                toggleMusicBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                musicStatus.textContent = 'Music: On';
                toggleMusicBtn.classList.remove('muted');
                
                // Resume playing from the saved position
                playCharacterMusic(currentCharacter);
            }
        });
        
                // Save current audio time position
                function saveCurrentAudioTime() {
                    try {
                        for (const [key, audio] of Object.entries(audioElements)) {
                            if (audio && !audio.paused) {
                                currentAudioTime = audio.currentTime;
                                lastActiveAudio = key;
                                break;
                            }
                        }
                    } catch (error) {
                        console.error("Error in saveCurrentAudioTime:", error);
                    }
                }
                
                // Music control functions
                function pauseAllMusic() {
                    try {
                        if (crossfadeTimeoutId) {
                            clearInterval(crossfadeTimeoutId);
                            crossfadeTimeoutId = null;
                        }
                        
                        for (const audio of Object.values(audioElements)) {
                            if (audio && !audio.paused) {
                                audio.pause();
                            }
                        }
                    } catch (error) {
                        console.error("Error in pauseAllMusic:", error);
                    }
                }
                
                function playCharacterMusic(character, preserveTime = true) {
                    try {
                        if (isMusicMuted) return;
                        
                        // Save time position from current playing track
                        if (preserveTime) {
                            saveCurrentAudioTime();
                        }
                        
                        // Pause all currently playing music

                        // Play the appropriate music for the selected character
                        // And set the time position to continue from the previous track
                        switch(character) {
                            case 'blackjack':
                                if (blackjackMusicState === 'humility' && audioElements.blackjackHumility) {
                                    audioElements.blackjackHumility.currentTime = currentAudioTime;
                                    audioElements.blackjackHumility.volume = currentVolume;
                                    const playPromise = audioElements.blackjackHumility.play();

                                        playPromise.catch(e => console.log("Audio play failed:", e));
                                    }
                                } else if (audioElements.blackjackBravery) {
                                    audioElements.blackjackBravery.currentTime = currentAudioTime;

                                    audioElements.yuki.volume = currentVolume;
                                    const playPromise = audioElements.yuki.play();
                                    if (playPromise !== undefined) {
                                        playPromise.catch(e => console.log("Audio play failed:", e));
                                    }
                                }
                                clearTimeout(animationTimeoutId);

                                }
                                clearTimeout(animationTimeoutId);

                            case 'flowey':
                                // Check if audio failed before attempting to play
                                if (!floweyAudioFailed && audioElements.flowey) {
                                    audioElements.flowey.currentTime = currentAudioTime;
                                    audioElements.flowey.volume = currentVolume;
                                    const playPromise = audioElements.flowey.play();
                                    if (playPromise !== undefined) {
                                        playPromise.catch(e => {
                                            console.log("Flowey audio play failed:", e);
                                            floweyAudioFailed = true;
                                            const troubleshootMsg = document.getElementById('troubleshoot-message');

                                                troubleshootMsg.classList.add('show');

                                } else {
                                    const troubleshootMsg = document.getElementById('troubleshoot-message');
                                    if (troubleshootMsg) {
                                        troubleshootMsg.classList.add('show');

                function startBlackjackMusicCycle() {

                        animationTimeoutId = setTimeout(() => {
                            if (currentCharacter === 'blackjack' && !isMusicMuted) {

                    } catch (error) {

        // Snow effect for Yuki
        function createSnowflakes() {
            const snowContainer = document.getElementById('snow-container');
            snowContainer.innerHTML = ''; // Clear existing snowflakes
            
            // Create 50 snowflakes with different sizes and speeds
            for (let i = 0; i < 50; i++) {
                const snowflake = document.createElement('div');
                
                // Randomize snowflake properties
                const size = Math.random() < 0.3 ? 'small' : (Math.random() < 0.7 ? 'medium' : 'large');
                const sway = Math.random() < 0.4; // 40% chance of swaying movement
                const left = Math.random() * 100; // Random horizontal position (0-100%)
                const animationDelay = Math.random() * 20; // Random delay (0-20s)
                
                // Set snowflake classes and styles
                snowflake.className = `snowflake ${size}${sway ? ' sway' : ''}`;
                snowflake.style.left = `${left}%`;
                snowflake.style.animationDelay = `${animationDelay}s`;
                
                // Add to container
                snowContainer.appendChild(snowflake);
                snowflakes.push(snowflake);
            }
        }
        
        // Falling petals effect for Flowey
        function createPetals() {
            const petalContainer = document.getElementById('petal-container');
            petalContainer.innerHTML = ''; // Clear existing petals
            
            // Different petal icon options
            const petalIcons = [
                '<i class="fas fa-leaf"></i>',
                '<i class="fas fa-seedling"></i>',
                '<i class="fas fa-spa"></i>',
                '<i class="fas fa-fan"></i>'
            ];
            
            // Create 30 petals with different sizes and speeds
            for (let i = 0; i < 30; i++) {
                const petal = document.createElement('div');
                
                // Randomize petal properties
                const size = Math.random() < 0.3 ? 'small' : (Math.random() < 0.7 ? 'medium' : 'large');
                const sway = Math.random() < 0.5; // 50% chance of swaying movement
                const left = Math.random() * 100; // Random horizontal position (0-100%)
                const animationDelay = Math.random() * 15; // Random delay (0-15s)
                const iconIndex = Math.floor(Math.random() * petalIcons.length);
                const isGolden = Math.random() < 0.2; // 20% chance of golden petal
                
                // Set petal classes and styles
                petal.className = `petal ${size}${sway ? ' sway' : ''}${isGolden ? ' golden' : ''}`;
                petal.style.left = `${left}%`;
                petal.style.animationDelay = `${animationDelay}s`;
                petal.innerHTML = petalIcons[iconIndex];
                
                // Add to container
                petalContainer.appendChild(petal);
                petals.push(petal);
            }
        }
        
        // Toggle character effects based on selected character
        function toggleCharacterEffects(character) {
            try {
                // Snow effect for Yuki
                const snowContainer = document.getElementById('snow-container');
                if (snowContainer) {
                    if (character === 'yuki') {
                        // Create snowflakes if they don't exist yet
                        if (snowflakes.length === 0) {
                            createSnowflakes();
                        }
                        snowContainer.classList.add('active');
                    } else {
                        snowContainer.classList.remove('active');
                    }
                }
                
                // Petal effect for Flowey
                const petalContainer = document.getElementById('petal-container');
                if (petalContainer) {
                    if (character === 'flowey') {
                        // Create petals if they don't exist yet
                        if (petals.length === 0) {
                            createPetals();
                        }
                        petalContainer.classList.add('active');
                        
                        // Show troubleshooting message if audio failed
                        const troubleshootMsg = document.getElementById('troubleshoot-message');
                        if (troubleshootMsg && floweyAudioFailed) {
                            troubleshootMsg.classList.add('show');
                        }
                    } else {
                        petalContainer.classList.remove('active');
                        const troubleshootMsg = document.getElementById('troubleshoot-message');
                        if (troubleshootMsg) {
                            troubleshootMsg.classList.remove('show');
                        }
                    }
                }
                
                // Add neon borders to Snaps' elements
                if (character === 'snaps') {
                    const snapsElements = document.querySelectorAll('.character-snaps');
                    snapsElements.forEach(el => {
                        // Remove any existing neon borders to prevent duplicates
                        const existingBorders = el.querySelectorAll('.neon-border');
                        existingBorders.forEach(border => border.remove());
                        
                        // Add new neon border
                        const border = document.createElement('div');
                        border.className = 'neon-border';
                        el.appendChild(border);
                    });
                }
            } catch (error) {
                console.error("Error in toggleCharacterEffects:", error);
            }
        }

        // Initialize character data in Firebase if not exists and load all data
        async function initializeFirebaseData() {
            try {
                // Check if data exists in Firebase
                const snapshot = await database.ref('characters').once('value');
                
                if (!snapshot.exists()) {
                    // If data doesn't exist, initialize with default values
                    await database.ref('characters').set(defaultCharacters);
                    console.log('Firebase initialized with default character data');
                    
                    // Cache the default characters
                    Object.keys(defaultCharacters).forEach(charName => {
                        cachedCharacters[charName] = defaultCharacters[charName];
                    });
                } else {
                    // Data exists, cache it
                    const charactersData = snapshot.val();
                    Object.keys(charactersData).forEach(charName => {
                        cachedCharacters[charName] = charactersData[charName];
                    });
                    
                    // Check if Flowey exists, add if not
                    if (!charactersData.flowey) {
                        await database.ref('characters/flowey').set(defaultCharacters.flowey);
                        cachedCharacters.flowey = defaultCharacters.flowey;
                        console.log('Flowey character added to Firebase');
                    }
                }
                
                // Check audio file loading
                checkAudioLoading();
                
                // Load saved volume setting
                loadSavedVolume();
                
                // Display the initial character
                renderCharacter(cachedCharacters[currentCharacter]);
                
                // Initialize Blackjack's theme
                if (currentCharacter === 'blackjack') {
                    // Add appropriate state class
                    const characterElements = document.querySelectorAll('.character-blackjack');
                    characterElements.forEach(el => {
                        el.classList.add(`${blackjackMusicState}-state`);
                    });
                    
                    // Update the state display
                    updateMusicStateDisplay();
                }
                
                // Set up real-time listeners for all characters
                setupRealtimeListeners();
                
                // Start playing music for initial character
                playCharacterMusic(currentCharacter, false); // Don't preserve time on initial load
                
                // Set up Blackjack's music/theme cycle
                if (currentCharacter === 'blackjack') {
                    startBlackjackMusicCycle();
                }
                
                // Initialize character effects
                toggleCharacterEffects(currentCharacter);
            } catch (error) {
                console.error('Error initializing Firebase data:', error);
                document.getElementById('connection-status').textContent = 'Connection error';
                document.getElementById('connection-status').style.color = 'crimson';
                
                // Use default data if there's an error
                Object.keys(defaultCharacters).forEach(charName => {
                    cachedCharacters[charName] = defaultCharacters[charName];
                });
                renderCharacter(cachedCharacters[currentCharacter]);
            }
        }
        
        // Set up real-time listeners for all characters
        function setupRealtimeListeners() {
            // Set up listeners for each character
            Object.keys(defaultCharacters).forEach(charName => {
                database.ref(`characters/${charName}`).on('value', (snapshot) => {
                    const characterData = snapshot.val();
                    if (characterData) {
                        // Update the cached data
                        cachedCharacters[charName] = characterData;
                        
                        // If this is the current character, update the display
                        if (charName === currentCharacter) {
                            renderCharacter(characterData);
                        }
                    }
                }, (error) => {
                    console.error(`Error listening to ${charName} data:`, error);
                });
            });
        }
        
        // Add event listeners to character buttons
        document.querySelectorAll('.character-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                // Update active button
                document.querySelector('.character-btn.active').classList.remove('active');
                e.target.classList.add('active');
                
                // Save current audio time before changing character
                saveCurrentAudioTime();
                
                // Update current character
                currentCharacter = e.target.getAttribute('data-character');
                
                // No loading screen - display immediately from cache
                renderCharacter(cachedCharacters[currentCharacter]);
                
                // Toggle character effects based on selection
                toggleCharacterEffects(currentCharacter);
                
                // Play the character's music preserving the time position
                playCharacterMusic(currentCharacter);
            });
        });
        
        // Get element icon based on type
        function getElementIcon(element) {
            switch(element) {
                case 'fire': return '<i class="fas fa-fire" style="color: var(--fire);"></i>';
                case 'water': return '<i class="fas fa-tint" style="color: var(--water);"></i>';
                case 'earth': return '<i class="fas fa-mountain" style="color: var(--earth);"></i>';
                case 'air': return '<i class="fas fa-wind" style="color: var(--air);"></i>';
                case 'light': return '<i class="fas fa-sun" style="color: var(--light);"></i>';
                case 'dark': return '<i class="fas fa-moon" style="color: var(--dark);"></i>';
                case 'plant': return '<i class="fas fa-seedling" style="color: var(--plant);"></i>';
                default: return '<i class="fas fa-magic"></i>';
            }
        }
        
        // Function to determine primary stat and add effect
        function addPrimaryStatEffect(characterData) {
            // Determine primary stat (highest among ATK, DEF, HP)
            let primaryStat = 'HP';
            let highestValue = characterData.HP;
            
            if (characterData.ATK > highestValue) {
                primaryStat = 'ATK';
                highestValue = characterData.ATK;
            }
            
            if (characterData.DEF > highestValue) {
                primaryStat = 'DEF';
                highestValue = characterData.DEF;
            }
            
            // Find all stat values
            setTimeout(() => {
                const statElements = document.querySelectorAll('.stat');
                
                statElements.forEach(statElement => {
                    const nameElement = statElement.querySelector('.stat-name');
                    if (nameElement && nameElement.textContent.includes(primaryStat)) {
                        const valueElement = statElement.querySelector('.stat-value');
                        if (valueElement) {
                            valueElement.classList.add('primary-stat');
                        }
                    }
                });
            }, 10);
        }
        
                // Function to render character data
                function renderCharacter(character) {
                    try {
                        const characterDisplay = document.getElementById('character-display');
                        if (!characterDisplay) return;
                        
                        const manaPercentage = Math.round((character.mana / character.maxMana) * 100);
                        
                        // Determine character class for theming
                        const characterClass = `character-${currentCharacter}`;
                        
                        // Special class for Blackjack's state
                        const blackjackStateClass = currentCharacter === 'blackjack' ? 
                            `${blackjackMusicState}-state` : '';
                        
                        // Determine profile picture for Blackjack based on state
                        let profilePicture = character.profilePicture || 'default-avatar.png';
                        if (currentCharacter === 'blackjack') {
                            if (blackjackMusicState === 'bravery') {
                                profilePicture = 'blackjack2.png';
                            } else {
                                profilePicture = 'blackjack.png';
                            }
                        }
                        
                        characterDisplay.innerHTML = `
                            <div class="character-profile ${characterClass} ${blackjackStateClass}">
                                <img src="${profilePicture}" alt="${character.name}" class="profile-image">
                                <h2 class="character-name">${character.name}</h2>
                                <div class="stat">

                                    <span class="stat-value">${character.LOVE}</span>
                                </div>
                                <div class="stat">

                                    <span class="stat-value">${character.LV}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-coins"></i> G (Gold)&nbsp</span>
                                    <span class="stat-value">${character.G}</span>
                                </div>
                            </div>
                            
                            <div class="character-stats ${characterClass} ${blackjackStateClass}">
                                <h2><i class="fas fa-chart-bar"></i> Stats</h2>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-heart"></i> HP</span>
                                    <span class="stat-value">${character.HP}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-fist-raised"></i> ATK</span>
                                    <span class="stat-value">${character.ATK}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-shield-alt"></i> DEF</span>
                                    <span class="stat-value">${character.DEF}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-bolt"></i> PARRY CHANCE</span>
                                    <span class="stat-value">${character["PARRY CHANCE"]}%</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-name"><i class="fas fa-flask"></i> Mana</span>
                                    <span class="stat-value">${character.mana}/${character.maxMana}</span>
                                </div>
                                <div class="mana-container">
                                    <div class="mana-bar" style="width: ${manaPercentage}%"></div>
                                </div>
                            </div>
                            
                            <div class="character-inventory ${characterClass} ${blackjackStateClass}">
                                <h2><i class="fas fa-suitcase"></i> Inventory</h2>
                                ${character.inventory && character.inventory.length > 0 
                                    ? character.inventory.map(item => `
                                        <div class="inventory-item">
                                            <span><i class="fas fa-box-open"></i> ${item}</span>
                                        </div>
                                    `).join('') 
                                    : '<div class="inventory-item"><span>No items</span></div>'
                                }
                            </div>
                            
                            <div class="character-magic ${characterClass} ${blackjackStateClass}">
                                <h2><i class="fas fa-hat-wizard"></i> Magic Spells</h2>
                                ${character.spells && character.spells.length > 0 
                                    ? character.spells.map(spell => `
                                        <div class="spell-card">
                                            <div class="spell-header">
                                                <div class="spell-name">${getElementIcon(spell.element)} ${spell.name}</div>
                                                <div class="spell-cost"><i class="fas fa-flask"></i> ${spell.manaCost} Mana</div>
                                            </div>
                                            <div class="spell-element element-${spell.element}">${spell.element.charAt(0).toUpperCase() + spell.element.slice(1)}</div>
                                            <div class="spell-description">${spell.description}</div>
                                        </div>
                                    `).join('') 
                                    : '<div class="spell-card"><div class="spell-name">No spells learned yet</div></div>'
                                }
                            </div>
                        `;
                        
                        // Add special effect to primary stat
                        addPrimaryStatEffect(character);
                        
                        // Update state indicator if on Blackjack
                        if (currentCharacter === 'blackjack') {
                            updateMusicStateDisplay();
                            const indicator = document.querySelector('.music-state-indicator');
                            if (indicator) indicator.style.display = 'inline-block';
                        } else {
                            // Hide state indicator for other characters
                            const indicator = document.querySelector('.music-state-indicator');
                            if (indicator) indicator.style.display = 'none';
                        }
                        
                        // Add animation to stats when they change
                        setTimeout(() => {
                            document.querySelectorAll('.stat-value').forEach(el => {
                                if (!el.classList.contains('primary-stat')) {
                                    el.classList.add('changing');
                                    setTimeout(() => el.classList.remove('changing'), 1000);
                                }
                            });
                        }, 10);
                        
                        // Animate mana bar
                        setTimeout(() => {
                            const manaBar = document.querySelector('.mana-bar');
                            if (manaBar) {
                                manaBar.style.width = '0%';
                                setTimeout(() => {
                                    manaBar.style.width = manaPercentage + '%';
                                }, 10);
                            }
                        }, 10);
                        
                        // Apply Snaps' neon effect if needed
                        if (currentCharacter === 'snaps') {
                            toggleCharacterEffects('snaps');
                        }
                    } catch (error) {
                        console.error("Error in renderCharacter:", error);
                    }
                }
        
        // Handle page visibility changes to pause/resume when tab is inactive
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden, save audio time and pause
                saveCurrentAudioTime();
                pauseAllMusic();
            } else {
                // Page is visible again, resume playing if not muted
                if (!isMusicMuted && currentAudioTime > 0) {
                    playCharacterMusic(currentCharacter);
                }
            }
        });
        
        // Initialize the application
        initializeFirebaseData();
    </script>
